; Tropico widescreen patch -- configuration.
;
; Every fix the patch performs is ON by default. This file exists to name the
; resolution and to hold the two things that are genuinely preferences. The
; reasoning behind each fix is in FINDINGS.md (sections 8-72); it is not repeated
; here, because a config file that has to be read to be used is friction.
;
; The mode below is normally written by tools/tropico-setmode.sh, which also swaps
; the matching UI art into data/. The two must agree: art is authored per
; resolution and the engine will not scale it, so editing Width/Height by hand
; without running that script gives you a correct world and a broken HUD. The
; patch checks for exactly that and says so in tropico-fix.log.

[Resolution]
Width=1920
Height=1080

[Intro]
; Play the startup movie on every launch. Stock behaviour is first-run-only: the
; guard is a one-shot the game clears after playing once (FINDINGS 68), so this is
; a preference rather than a fix. Set 0 for stock behaviour.
Force=1

; ---------------------------------------------------------------------------
; Turning things off, and diagnostics.
;
; Every fix can be disabled with a 0, and every probe enabled with a 1, using the
; keys documented in FINDINGS 72. The ones most likely to be wanted:
;
;   [WorldFix] Enable=0   leave the world renderer stock (terrain stops at 1600)
;   [Menu]     Slot=-1    leave the menu and intro in the stock 640x480 box
;   [VText]    Enable=0   leave rotated tab labels exactly as PopTop drew them
;   [VText]    Probe=1    log every rotated draw with its box geometry -- this is
;                         how the dials for a new resolution get measured
; ---------------------------------------------------------------------------
