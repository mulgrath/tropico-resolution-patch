; Tropico widescreen patch -- configuration.
;
; Every fix the patch performs is ON by default. This file exists to hold the few
; things that are genuinely preferences. The reasoning behind each fix is in
; FINDINGS.md (sections 8-99); it is not repeated here, because a config file that
; has to be read to be used is friction.
;
; YOU DO NOT NORMALLY NEED TO SET A RESOLUTION.
;
; The patch runs the game at the resolution of the monitor you launched it from,
; and builds the interface art to match the first time it sees that size -- about
; a second, once per resolution. Leaving [Resolution] empty is what keeps that
; working when you move the game to another monitor or change your display.
;
; Setting Width and Height forces a mode instead. Two things to know before you do:
;
;   - the launch monitor's own mode OUTRANKS this, so on a multi-monitor setup the
;     value here is only consulted when the patch could not read the display
;   - the GOG launcher REWRITES these two lines on every launch, to the monitor it
;     chose. Editing them by hand only sticks for launches that do not go through
;     it -- which in practice means Steam's Play button
;
; Width must be a multiple of 4 or the image shears (FINDINGS 10), which rules out
; 1366x768. The patch checks, refuses, and says so in tropico-fix.log.

[Resolution]
;Width=2560
;Height=1440

[Intro]
; Play the startup movie on every launch. Stock behaviour is first-run-only: the
; guard is a one-shot the game clears after playing once (FINDINGS 68), so this is
; a preference rather than a fix. Set 0 for stock behaviour.
Force=1

; ---------------------------------------------------------------------------
; Turning things off, and diagnostics.
;
; Every fix can be disabled with a 0, and every probe enabled with a 1, using the
; keys documented in FINDINGS 72. The ones most likely to be wanted:
;
;   [WorldFix] Enable=0   leave the world renderer stock (terrain stops at 1600)
;   [Menu]     Slot=-1    leave the menu and intro in the stock 640x480 box
;   [Hardware] Enable=1   offer Hardware 3D again. It is refused by default: it
;                          renders correctly only on the GOG build under system
;                          wine, smears at every resolution under Proton
;                          (FINDINGS 23), and crashes on map entry on native
;                          Windows -- where the choice persists to TROPICO.CFG and
;                          F2 is then unreachable to undo it (FINDINGS 91). With
;                          it refused, asking for Hardware 3D gets the game's own
;                          "not available on this computer" message. The hardware
;                          path existed to spare a 2001 CPU; a modern one runs the
;                          software renderer without noticing.
;   [Display]  ForceFullscreen=0   let the F2 "Fullscreen" checkbox work again.
;                          It is clamped by default because unchecking it persists
;                          into TROPICO.CFG and leaves the game at 640x480 with a
;                          #150 on every map load (FINDINGS 79).
;   [Display]  DeviceSelect=1   play on the monitor you launch from, WITHOUT anything
;                          being made primary. WINDOWS ONLY, and off by default while
;                          it is new.
;
;                          This is the answer SetPrimary below is a workaround for.
;                          Tropico's fullscreen goes to whichever DirectDraw DEVICE it
;                          asks for, and on Windows every monitor is a device with its
;                          own name -- so the patch asks for yours instead of moving
;                          your desktop around. MEASURED on Windows 11: the game's
;                          monitor renders at its own resolution and the primary is
;                          never touched (FINDINGS 118).
;
;                          Nothing is changed on your computer, so there is nothing to
;                          undo and nothing that can be left behind by a crash. That is
;                          the whole reason it exists.
;
;                          It does nothing under Wine or Proton, and says so in the log:
;                          Wine reports one device for all your monitors, so there is
;                          nothing to choose between. Linux reaches the monitor the way
;                          it always has.
;
;                          WHICH MONITOR: the one you launched from. The patch asks the
;                          desktop what window had focus when the game started -- which
;                          is the thing you clicked -- and falls back to the mouse
;                          pointer if nothing did. Both are named in tropico-fix.log, so
;                          if it picks wrong the log says which signal answered. Setting
;                          [Display] Monitor below overrides it, for "always the
;                          projector, wherever I launch from".
;
;                          OFF BY DEFAULT because it is new, not because it is doubted.
;                          If you turn it on and the game opens on the wrong screen, the
;                          log says which device it asked for and which ones exist.
;   [Display]  SetPrimary=1   play on the monitor you launch from, instead of on your
;                          primary one. OFF BY DEFAULT ON WINDOWS; on by default under
;                          Wine. It does nothing on a single monitor, and nothing when
;                          tools/tropico launched the game -- that already chose.
;
;                          Tropico's fullscreen always goes to whichever monitor is
;                          primary, so reaching another one means making it primary for
;                          the length of the game and handing it back afterwards. That
;                          is a change to YOUR COMPUTER rather than to the game, and the
;                          two platforms can undo it to very different standards.
;
;                          ON LINUX the restore runs OUTSIDE the game: a watchdog on a
;                          heartbeat, or the launcher's own exit trap. Neither cares how
;                          the game ended -- a crash and a clean quit look the same to
;                          them -- and the primary is runtime state your desktop re-sets
;                          at login anyway, so even losing the watchdog heals itself.
;                          That is why it stays on by default there (FINDINGS 90, 99).
;
;                          ON WINDOWS there is nothing outside the process to restore it
;                          -- this package ships no helper program -- and the change is
;                          written into your saved display configuration, so it SURVIVES
;                          A REBOOT. A crash, or ending the game from Task Manager, can
;                          leave your primary monitor moved with nothing left running to
;                          connect it to. tropico-primary.state next to Tropico.EXE is
;                          the backstop and puts it back at the next launch; Windows'
;                          own Display settings undo it at any time.
;
;                          Turn it on if you want it and that trade is acceptable to
;                          you. Otherwise the game opens on your primary monitor, at
;                          that monitor's resolution, which is what this patch is for
;                          (FINDINGS 113.8).
;
;                          PREFER DeviceSelect ABOVE. It reaches the same monitor
;                          without changing anything on your computer, so none of the
;                          paragraphs above apply to it. This key remains for anyone who
;                          wants the old behaviour or is on a machine where the new one
;                          cannot resolve the monitor.
;
;                          THIS KEY GATES THE WHOLE CHOICE OF MONITOR, so with it off
;                          the two keys below -- Monitor and FollowLaunchMonitor -- do
;                          nothing. They say WHICH monitor; this one is what allows a
;                          monitor other than the primary to be reached at all. Set
;                          either of them with SetPrimary=0 and tropico-fix.log says so
;                          rather than leaving you to wonder.
;   [Art]      Generate=0   do not generate artwork at launch. The patch normally
;                          builds the UI art set for the resolution it is about to
;                          use, from your own px*.PK2 archives, the first time it
;                          sees a new one -- about a second, once, and never again
;                          for that resolution. data\ARTSET-MODE.txt records which
;                          mode the art in data\ was built for; when it agrees with
;                          the mode, nothing is generated. On Linux the launcher
;                          normally does this beforehand, so this does nothing there.
;                          Turn it off to leave data\ exactly as it is.
;   [Art]      FontNearest=1   scale glyphs with nearest-neighbour instead of the
;                          default area-average. Sharper stems on an upscale, and at
;                          exactly 2x (a 2160-tall screen) the two are identical
;                          anyway; the default reads better at 1440p (FINDINGS 86).
;   [Display]  VirtualDesktop=1   run the game inside a Wine virtual desktop, the
;                          way tools/tropico already does on GOG. EXPERIMENTAL, off by
;                          default, and DO NOT TURN IT ON to reach a resolution -- it
;                          prevents that. Read FINDINGS 109 before using it.
;
;                          THE COST, measured: Wine sizes the desktop from whichever
;                          monitor is PRIMARY when it creates it, which is before the
;                          game's first instruction, and SM_CXSCREEN is then frozen at
;                          that size. The patch makes your launch monitor primary
;                          during the run -- too late to be noticed -- so inside a
;                          desktop a monitor that was not already primary can never be
;                          used at its own resolution. Every launch arms the right
;                          size for a next launch identical to itself.
;
;                          THE REASON IT WAS ADDED IS NOT A REASON. It was armed on the
;                          grounds that the game cannot see the monitor layout inside a
;                          desktop, and so cannot show FINDINGS 89's camera drift. That
;                          was measured and is false: it drifted inside one anyway.
;
;                          WHAT MIGHT STILL BE REAL: a desktop presents one screen at
;                          0,0, and stock Tropico's DirectDraw assumes the primary
;                          adapter (PCGamingWiki's multi-monitor advice is to translate
;                          DirectDraw away entirely). So it may guard the #150 geometry.
;                          Unproven either way -- that is why it is kept rather than
;                          deleted.
;
;                          It takes effect on the NEXT launch, not this one: the desktop
;                          has to exist before the game starts, so the patch can only arm
;                          it. Setting it back to 0 removes it again, one launch later.
;   [Display]  Monitor=DP-3   force the output by name instead of detecting it.
;                          NEEDS SetPrimary=1 OR DeviceSelect=1 -- see above. On Windows
;                          neither is on by default, and with both off this key does
;                          nothing (the log says so).
;                          The name is the one your platform uses: an xrandr output
;                          on Linux (DP-3, HDMI-A-1), and a Windows display device
;                          on Windows -- \\.\DISPLAY1, \\.\DISPLAY2, written exactly
;                          like that. Both appear in tropico-fix.log at every launch,
;                          which is the reliable way to find yours -- the log lists
;                          them whatever SetPrimary is set to. A name that is not
;                          attached is ignored with a warning, and detection is used.
;   [Display]  FollowLaunchMonitor=0   still choose the monitor, but keep the mode
;                          from [Resolution] rather than adopting the launch
;                          monitor's own mode and its staged art set. NEEDS
;                          SetPrimary=1 or DeviceSelect=1 for the same reason Monitor
;                          does: with no monitor being chosen there is no launch monitor
;                          to follow.
;   [Text]     Enable=0   leave the bottom-bar readouts PopTop's grey. They are
;                          white by default: Treasury / Swiss Bank / Date / Population
;                          are drawn with the engine's [C2] colour tag, which is
;                          RGB555 197,197,197 (FINDINGS 87). The building panel's
;                          Owners / Wages / Rent share that tag and follow.
;   [Text]     ReadoutColour=30653   a raw RGB555 word in DECIMAL (hex is not parsed
;                          by the ini reader). 32767 = white, the default; 30653 is
;                          the engine's own softer near-white.
;   [VText]    Enable=0   leave rotated tab labels exactly as PopTop drew them
;   [VText]    Probe=1    log every rotated draw with its box geometry -- this is
;                         how the dials for a new ASPECT get measured. They do not
;                         depend on the resolution: 16:9 and 4:3 are both handled
;                         automatically, and only a third aspect needs a run
;                         (FINDINGS 86).
;   [FrameCount] Enable=1   count frames and write a [fps] line to tropico-fix.log
;                          every few seconds. It is a MEASUREMENT, not a feature:
;                          nothing the game does is intercepted. One Blt on the
;                          primary is one frame -- this engine has no flipping
;                          chain (FINDINGS 117) -- so the blit is forwarded exactly
;                          as the game issued it and only noted in passing.
;
;                          Each line carries the mode, the frame count, the mean,
;                          p50/p95/p99 and the worst frame in the window. The
;                          percentiles are the point: a mean alone cannot tell a
;                          few large stalls apart from a uniformly slow render.
;
;                          The menu is not the number to read. It is nearly static
;                          and cheap; what matters is a loaded map with the camera
;                          over terrain, which is where the software renderer
;                          actually works for its living.
;   [FrameCount] Interval=5   seconds between report lines. Minimum 1.
; ---------------------------------------------------------------------------
