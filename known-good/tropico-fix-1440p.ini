; ---------------------------------------------------------------------------
; RUN I -- the gated fix at 2560x1440.
;
;   TROPICO_DISPLAY=DP-3 TROPICO_NODESK=1 TROPICO_RES=0 \
;     ~/tropico-resolution-patch/tools/tropico-gog.sh
;
; Expect in the log:
;   [+] slot 4 -> 2560x1440
;   [+] world painter at 00526220: FORCED writes for the call at 0050b15b,
;       gated on viewport width >= 1280 ...
;
; Guard is recomputed from the mode automatically -- 960 at 1080p, 1280 here.
; That is the whole point of this run: the gate has to travel with the mode,
; not just happen to be right at one resolution.
;
; Check:
;   1. Terrain and void full 2560x1440 (as run F).
;   2. Click a building or citizen -- preview in the right place, as run H.
;
; The HUD will still be a mess.  Ignore it; that is the next project, and it is
; an art problem rather than an engine one.
; ---------------------------------------------------------------------------
[Resolution]
Width=2560
Height=1440

[WorldFix]
Enable=1
Force=1
Guard=-1
Width=2560
Height=1440
ObjW=3200
ObjH=2400
Ctor=0
