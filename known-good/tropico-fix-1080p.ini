; ---------------------------------------------------------------------------
; VTEXT RUN -- rotated tab-label placement, FINDINGS section 65.
;
;   TROPICO_NODESK=1 TROPICO_RES=0 ~/tropico-resolution-patch/tools/tropico-gog.sh
;   start a map -> F2 -> climb to 1920x1080 -> open F2 settings / the almanac
;
; Expect in tropico-fix.log:
;   [*] [vtext] 2 tab-layout site(s) found
;         [0] ...: box Y +5, box X +3, clip H 291      <- F2 settings tabs
;         [1] ...: box Y +5, box X +3, clip H 291      <- almanac tabs
;   [+] box Y origin: +5 -> -22 virtual
;
; If those lines are absent the patch did not apply and NOTHING below is being
; tested -- check that first, before judging the picture.
;
; WHY. These tabs' layout is hard-coded in the exe; no .WIN file is read for them,
; which is why three runs of loose .WIN overrides did nothing. The plate is blitted
; at (x, y) and the label's box follows from `lea ebx,[esi+5]`. FUN_00450b10 CENTRES
; the label in that box, and at 1920x1080 the box is ~25 px taller than the plate,
; so the label hangs ~12 px out the bottom.
;
; DY moves the label. It is a SIGNED BYTE, so -128..127 virtual = -57..+57 px here.
;   DY = 5 - (pixels to move UP) * 2400 / Height
;   at 1080:  6 px -> -8    12 px -> -22    18 px -> -35    24 px -> -48
; DX does the same horizontally (stock +3); ClipH is where the label gets CUT
; (stock 291 virtual = 131 px at 1080). Leave a key out and that value stays stock.
; ---------------------------------------------------------------------------

[Resolution]
Width=1920
Height=1080

[WorldFix]
Enable=1
Force=1
Guard=-1
Width=1920
Height=1080
ObjW=3200
ObjH=2400
Ctor=0

[VText]
; ---------------------------------------------------------------------------
; ROTATED TEXT -- FINDINGS sections 65 and 66.  FROZEN for 1920x1080 2026-08-21,
; every value below confirmed in game by the owner.
;
; Tropico draws rotated (vertical) labels in three places, all through the same
; wrapper FUN_004526d0 -> FUN_00450b10, told apart by the rotation argument:
;
;   rot=3   F2 settings tabs      call site ...9e  -> BoxH  / BoxDY / BoxDX
;   rot=3   almanac tabs          call site ...1e  -> BoxH  / BoxDY / BoxDX
;   rot=2   building panel label  call site ...d8  -> BldgDH / BldgDY
;           (Owners on shacks, Wages on businesses, Rent on homes)
;
; THE DEFECT is one shape in both cases: the drawer centres the label using a
; length measured through the X scale and re-applied through the Y scale, so at
; 16:9 it believes every rotated label is ys/xs = 25% shorter than it is. The
; label overhangs its box and the drawer's own box intersection cuts what hangs
; out. At 4:3 ys == xs, the factor is 1, and PopTop never saw it.
;
; THE DIALS. All four rewrite the drawer's ARGUMENTS -- no .WIN file and no
; instruction immediate is involved, which is why loose .WIN overrides did
; nothing (section 64.2 is REFUTED). Two per site, because they do different jobs:
;
;   BoxH / BldgDH   ROOM. Grows the box. The floor drops by the whole amount but
;                   the label only follows part way, and that difference is the
;                   room gained. Raise this when a letter is cut.
;   BoxDY / BldgDY  POSITION, vertical. Translates the box rigidly; label and clip
;                   move together, so room is unchanged.
;   BoxDX           POSITION, horizontal. Same, on the other axis.
;
; Deliberately NOT the DY/DX/ClipH keys below: those patch instruction immediates
; and are not mode-gated, so they move the label in every stock mode too.
;
; RETUNING FOR ANOTHER MODE (e.g. 2560x1440). These values are gated on
; FixW x FixH and are correct only for that mode -- change FixW/FixH and every
; number here must be re-dialled. Units are VIRTUAL; convert with
;
;     vertical:    units = pixels * 2400 / Height     (1 px = 2.22 at 1080)
;     horizontal:  units = pixels * 3200 / Width      (1 px = 1.67 at 1920)
;
; Procedure, three or four runs: set the room dial generously and check no letter
; is cut; then walk the position dials in, converting the pixel offset you want
; with the formulas above. Raising the room dial drifts the label down by roughly
; two thirds of the growth, so pay that back on BoxDY/BldgDY.
;
; Probe=1 logs every rotated draw once per (call site, label, mode) with its box
; geometry -- where all of these numbers came from. It does not affect the
; correction; leave it 0 unless you are re-dialling.
; ---------------------------------------------------------------------------
Enable=1
Probe=0
Fix=1
FixW=1920
FixH=1080

; the two tab sites (rot=3) -- settings and almanac
BoxH=340
BoxDY=-99
BoxDX=-14

; the building panel label (rot=2). Entry=1 installs the wrapper-entry hook that
; carries this correction, so it is REQUIRED, not diagnostic.
Entry=1
BldgDH=107
BldgDY=-111

[Intro]
; s68 -- force the startup movie on every launch. The guard it removes is a
; ONE-SHOT the game clears after playing once, so without this the intro is a
; first-run-only event. Set 0 to restore stock behaviour.
Force=1

[Menu]
; ---------------------------------------------------------------------------
; THE MAIN MENU AND THE INTRO AT FULL RESOLUTION -- FINDINGS section 69.
;
; Stock, both render in a 640x480 box in the top-left corner of the screen. The
; cause is not a layout bug and not Wine: the startup sequence FUN_0047c370
; explicitly ASKS for resolution slot 0, through the engine's own apply-video
; routine -- because THE MENU ART WAS ONLY EVER AUTHORED AT 640x480. Seven assets
; (setuplb, setupran, stpruler, hiscore, foldmisc, foldmis2, credloge) exist solely
; as .i06. That is why every attempt to override the mode failed until the art was
; synthesised to match.
;
; Slot            which resolution slot the startup asks for. -1 = stock (640x480).
;                 Requires the seven .i16 assets to exist in data/, or the menu dies
;                 with "Error opening pack file item 'setuplb.i16'". Generate them:
;                   tropico-artset.py --width W --height H \
;                       --src-ext i06 --src-size 640x480 --missing-only --out DIR
;
; FixMovieScale   the movie blit clamps its DESTINATION extent down to the SOURCE
;                 extent (0x532063 and 0x532073). Correct for a 1:1 copy, fatal for a
;                 magnifying one, and invisible at 640x480 where the two are equal.
;                 Left alone, the movie tiles three across the top 160 px. Two bytes,
;                 jl -> jmp, and the engine's own 16.16 scaler fills the screen.
;                 REQUIRED whenever Slot is not -1.
;
; FixMoviePitch   DO NOT ENABLE. It overrides the pitch passed to BinkCopyToBuffer,
;                 which crashes: the game allocates a buffer of exactly
;                 movieW*movieH*2 and 1280 is the CORRECT pitch for it. Kept only so
;                 the dead end is not retried. Bink was never at fault.
;
; Fit             patches the 640x480 clamp at 0x515e58. Does nothing useful -- the
;                 menu and intro take the videowin.win branch, which bypasses that
;                 clamp entirely. Kept for the same reason.
;
; Probe / BlitProbe   diagnostics only; both are how the above was established.
; ---------------------------------------------------------------------------
Probe=0
BlitProbe=0
Fit=0
FixMoviePitch=0

Slot=4
FixMovieScale=1

SurfaceProbe=0
PreviewProbe=0
FixPreview=2
